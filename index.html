<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIT QX V3</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #00f2ff; --bg: #010409; --card: #0d1117; --up: #00ffa3; --down: #ff3c5f; --border: rgba(0, 242, 255, 0.2); }
        body, html { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }

        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-card { width: 380px; background: var(--card); border-radius: 25px; padding: 40px; border: 1px solid var(--border); text-align: center; }
        
        #welcomeScreen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1500; text-align: center; }
        .main-card { width: 440px; background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid var(--border); display: none; margin: 20px; }
        
        .input-field { width: 100%; background: #080c12; border: 1px solid #30363d; color: #fff; padding: 14px; border-radius: 12px; margin-top: 12px; outline: none; box-sizing: border-box; font-size: 14px; text-align: center; }
        .btn-gen { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 900; background: linear-gradient(90deg, #00f2ff, #007bff); color: #fff; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
        
        .tab-box { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 5px; scrollbar-width: none; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        .risk-warning { background: rgba(255, 60, 95, 0.1); border: 1px solid rgba(255, 60, 95, 0.2); padding: 10px; border-radius: 10px; font-size: 10px; color: #ff3c5f; text-align: center; margin-bottom: 15px; }
        .res-panel { display: none; margin-top: 20px; background: rgba(0, 242, 255, 0.05); border: 1px solid var(--accent); border-radius: 20px; padding: 20px; text-align: center; }
        .sig-val { font-size: 48px; font-weight: 900; }
        .footer { text-align: center; font-size: 10px; color: #4e555f; margin-top: 20px; padding-top: 10px; border-top: 1px solid #21262d; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="font-family:'Syncopate'; font-size:18px; color:var(--accent);">BASIT TERMINAL</h2>
        <p style="font-size:10px; color:#8b949e; margin-top:-10px;">CLOUD SECURITY V3</p>
        <input type="text" id="user" class="input-field" placeholder="USERNAME">
        <input type="password" id="pass" class="input-field" placeholder="PASSCODE">
        <button class="btn-gen" id="authBtn" onclick="doLogin()">AUTHENTICATE</button>
    </div>
</div>

<div id="welcomeScreen">
    <div style="font-weight:900; font-size:32px;">WELCOME BASIT</div>
    <div style="font-weight:bold; color:var(--accent); font-size:14px;">V3 ACCESS GRANTED</div>
</div>

<div class="main-card animate__animated animate__fadeIn" id="botUI">
    <h1 style="font-family:'Syncopate'; font-size:18px; text-align:center;">BASIT QX <span style="color:var(--accent)">V3</span></h1>
    <div class="risk-warning">⚠️ WARNING: Trading is risky. High accuracy does not guarantee profit.</div>

    <div class="tab-box">
        <button class="tab-btn active" onclick="setTab('CURRENCIES', this)">Currencies</button>
        <button class="tab-btn" onclick="setTab('CRYPTO', this)">Crypto</button>
        <button class="tab-btn" onclick="setTab('STOCKS', this)">Stocks</button>
        <button class="tab-btn" onclick="setTab('COMMODITIES', this)">Commodities</button>
    </div>

    <select id="assetSelect" class="input-field"></select>

    <button class="btn-gen" id="genBtn" onclick="generate()">GENERATE AI SIGNAL</button>

    <div class="res-panel" id="resBox">
        <div id="rPair" style="font-size:13px; opacity:0.6;">---</div>
        <div class="sig-val" id="rDir">---</div>
        <div id="timer" style="font-family:'Syncopate'; font-size:24px; color:var(--accent);">00:00</div>
    </div>
    <div class="footer">© 2025 ALL RIGHTS RESERVED TO BASIT</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI3OAYJ-oDRapb5J9N9A9685F1VmxYwW0",
        authDomain: "basit-qx.firebaseapp.com",
        projectId: "basit-qx",
        storageBucket: "basit-qx.firebasestorage.app",
        messagingSenderId: "1013913423706",
        appId: "1:1013913423706:web:82161028a98f732c21ad63",
        databaseURL: "https://basit-qx-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const pairs = {
        CURRENCIES: ["USD/EGP (OTC)", "USD/PKR (OTC)", "GBP/NZD (OTC)", "USD/TRY (OTC)", "AUD/NZD (OTC)", "EUR/USD", "GBP/JPY", "USD/INR (OTC)", "EUR/NZD (OTC)", "GBP/USD", "USD/JPY", "AUD/USD", "EUR/CAD", "USD/CAD"],
        CRYPTO: ["Bitcoin (OTC)", "Ethereum (OTC)", "Solana (OTC)", "Pepe (OTC)", "Shiba Inu (OTC)", "Floki (OTC)", "Dogecoin (OTC)"],
        STOCKS: ["Microsoft (OTC)", "FACEBOOK (OTC)", "Apple (OTC)", "McDonald's (OTC)", "NASDAQ 100"],
        COMMODITIES: ["Gold (OTC)", "Silver (OTC)", "UKBrent (OTC)", "USCrude (OTC)"]
    };

    async function doLogin() {
        const u = document.getElementById('user').value.toUpperCase().trim();
        const p = document.getElementById('pass').value.trim();
        const btn = document.getElementById('authBtn');

        if((u === "BASIT" || u === "SALAM") && p === "1") {
            btn.innerText = "CONNECTING V3...";
            btn.disabled = true;
            const hwid = btoa(navigator.userAgent).substring(0, 12);
            
            try {
                const ref = db.ref('users/' + u);
                const snapshot = await ref.once('value');
                const data = snapshot.val();

                if (data && data.hwid !== hwid) {
                    alert("DEVICE LOCKED! Only 1 device allowed in V3.");
                    btn.disabled = false; btn.innerText = "AUTHENTICATE";
                    return;
                }
                if (!data) await ref.set({ hwid: hwid, status: "active", version: "V3" });

                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('welcomeScreen').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('welcomeScreen').style.display = 'none';
                    document.getElementById('botUI').style.display = 'block';
                    setTab('CURRENCIES', document.querySelector('.tab-btn'));
                }, 2000);
            } catch (err) {
                alert("DATABASE ERROR!");
                btn.disabled = false; btn.innerText = "AUTHENTICATE";
            }
        } else { alert("WRONG CREDENTIALS"); }
    }

    function setTab(cat, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const s = document.getElementById('assetSelect');
        s.innerHTML = "";
        pairs[cat].forEach(p => {
            let o = document.createElement('option');
            o.value = p; o.innerText = p; s.appendChild(o);
        });
    }

    function generate() {
        document.getElementById('resBox').style.display = 'block';
        document.getElementById('rPair').innerText = document.getElementById('assetSelect').value;
        const d = document.getElementById('rDir');
        let up = Math.random() > 0.5;
        d.innerText = up ? "CALL ↑" : "PUT ↓";
        d.style.color = up ? "var(--up)" : "var(--down)";
    }
</script>
</body>
</html>
